[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
via_ir = true
optimizer = true
# Matches Uniswap v4-core's own settings; Pool.sol does not compile below this.
optimizer_runs = 44444444
bytecode_hash = "none"
gas_limit = "3000000000"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
